name: Multiplatform Release

on:
  push:
    tags:
      - 'v*' # Triggers only when you push a tag starting with 'v' (e.g., v1.0.2)

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: Damas-Linux
          - os: windows-latest
            artifact_name: Damas-Windows
          - os: macos-latest
            artifact_name: Damas-macOS

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # If your game uses external libraries like SDL2 or Raylib, install them here
    - name: Install Dependencies (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update

    - name: Configure CMake
      run: cmake --preset release

    - name: Build Project
      run: cmake --build build --config Release

    - name: Package with CPack
      run: |
        cd build
        cpack -C Release

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact_name }}
        path: build/Damas-*.* # Grabs the zip/tar.gz generated by CPack

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # Crucial permission for creating releases
    steps:
    - name: Download All Artifacts
      uses: actions/download-artifact@v4
      with:
        path: ./artifacts

    - name: Display structure of downloaded artifacts
      run: ls -R ./artifacts

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: ./artifacts/**/*
        generate_release_notes: true
